<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control de Inventario</title>
  <style>
    body { font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 20px; margin: 0; }
    .container { max-width: 800px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    h2 { color: #0056b3; text-align: center; }
    input, select, button { width: 100%; padding: 12px; margin-top: 8px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 14px; }
    button { background-color: #0056b3; color: white; border: none; font-weight: bold; cursor: pointer; }
    button:active { background-color: #004494; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 12px; }
    th, td { padding: 10px; border-bottom: 1px solid #ddd; text-align: left; }
    th { background-color: #0056b3; color: white; }
    tr:hover { background-color: #f1f1f1; }
    .seccion { margin-top: 30px; border-top: 2px solid #eee; padding-top: 20px; }
    #alerta { display: none; color: green; font-weight: bold; text-align: center; }
  </style>
</head>
<body>

  <div class="container">
    <h2>Catálogo de Inventario</h2>
    
    <!-- Buscador dinámico -->
    <input type="text" id="buscador" placeholder="Buscar por descripción, marca o código..." onkeyup="filtrarTabla()">

    <!-- Tabla donde se cargarán los datos de Google Sheets -->
    <div style="overflow-x:auto;">
      <table id="tablaInventario">
        <thead>
          <tr>
            <th>Cód</th>
            <th>Categoría</th>
            <th>Descripción</th>
            <th>Stock</th>
          </tr>
        </thead>
        <tbody id="cuerpoTabla">
          <tr><td colspan="4">Cargando inventario...</td></tr>
        </tbody>
      </table>
    </div>

    <!-- Formulario para registrar salidas de material -->
    <div class="seccion">
      <h2>Registrar Salida de Material</h2>
      <form id="formMovimiento">
        <label>Usuario / Técnico</label>
        <input type="text" name="usuario" placeholder="Tu nombre" required>
        
        <label>Código del Item</label>
        <input type="text" name="codigo" placeholder="Ej. INV-001" required>
        
        <label>Cantidad a retirar</label>
        <input type="number" step="0.1" name="cantidad" required>
        
        <label>Proyecto / Tablero</label>
        <input type="text" name="proyecto" placeholder="Ej. Tablero Compresores" required>
        
        <!-- Campo oculto para definir que siempre es una salida al usar este formulario -->
        <input type="hidden" name="tipo" value="Salida">
        
        <button type="submit">Registrar Salida</button>
      </form>
      <p id="alerta">¡Movimiento registrado con éxito!</p>
    </div>
  </div>

  <script>
    // === REEMPLAZA ESTA URL CON LA QUE COPIASTE DE APPS SCRIPT ===
    const URL_API = 'https://script.google.com/macros/s/AKfycbx08lO6SgX9emIE32XR6Bc4wbcAQxQuVMz5cmREiX3mOVdcHpQQpKZI3LYFMTUcR7vZ/exec';

    // Función para cargar los datos en la tabla al abrir la app
    function cargarInventario() {
      fetch(URL_API)
        .then(res => res.json())
        .then(data => {
          let html = '';
          data.forEach(item => {
            if(item.codigo) { // Evita filas vacías
              html += `<tr>
                        <td>${item.codigo}</td>
                        <td>${item.categoria}</td>
                        <td>${item.descripcion} <br><small>${item.marca} - ${item.serie}</small></td>
                        <td><strong>${item.stock}</strong></td>
                       </tr>`;
            }
          });
          document.getElementById('cuerpoTabla').innerHTML = html;
        });
    }

    // Función del buscador en tiempo real
    function filtrarTabla() {
      let filtro = document.getElementById("buscador").value.toUpperCase();
      let filas = document.getElementById("cuerpoTabla").getElementsByTagName("tr");
      
      for (let i = 0; i < filas.length; i++) {
        let textoFila = filas[i].textContent || filas[i].innerText;
        if (textoFila.toUpperCase().indexOf(filtro) > -1) {
          filas[i].style.display = "";
        } else {
          filas[i].style.display = "none";
        }
      }
    }

    // Enviar el formulario de salida de material
    document.getElementById('formMovimiento').addEventListener('submit', function(e) {
      e.preventDefault();
      let formData = new FormData(this);
      const btn = this.querySelector('button');
      btn.textContent = "Procesando...";

      fetch(URL_API, { method: 'POST', body: formData, mode: 'no-cors' })
        .then(() => {
          document.getElementById('alerta').style.display = 'block';
          this.reset();
          btn.textContent = "Registrar Salida";
          setTimeout(() => { document.getElementById('alerta').style.display = 'none'; }, 3000);
          
          // Recargar la tabla para mostrar el nuevo stock
          cargarInventario();
        })
        .catch(err => console.error(err));
    });

    // Cargar datos al iniciar
    cargarInventario();
  </script>
</body>
</html>
